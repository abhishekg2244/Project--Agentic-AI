name: Agentic AI Monitor

on:
  push:
    branches:
      - main

jobs:
  check-pod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Agentic AI Fix
        run: python agent.py
